yes and no:
  1: the internal "reference counting" is thread-safe
  2: but the std::shared_ptr instance itself and the object it points to are not automatically thread-safe

put is simple:
  1: Only the "reference counting" and "destruction" of object is thread safe
  2: nothing else

1:
  Name: The Control Block
  Thread-Safe: yes
  The Guarantee: Operations on the control block are atomic
  What this means:
    1: |
      If multiple threads hold different instances of a std::shared_ptr that point to the exact same object, 
      they can safely copy them, pass them around, or let them go out of scope simultaneously.
    2: |
      The underlying reference counter will increment and decrement perfectly without data races, 
      and the managed object will be deleted exactly once

2:
  Name: The std::shared_ptr Instance
  Thread-Safe: no
  The Rule: Treat a single std::shared_ptr instance exactly like a raw pointer or a standard int
  What this means: |
    If Thread A is trying to read a specific std::shared_ptr instance (e.g., copying it) 
    while Thread B is simultaneously writing to that same instance (e.g., calling .reset() or assigning it to a new object), 
    you will get a data race and undefined behavior

3:
  Name: The Managed Object
  Thread-Safe: no
  The Rule: The smart pointer only manages ownership; it does not protect the data inside
